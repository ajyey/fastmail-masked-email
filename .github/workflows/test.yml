# This workflow will do a clean install of node dependencies, run tests across different versions of node, and build it
name: test

on:
  push:
    branches-ignore: ['master', 'develop']
  pull_request:
    branches: ['master', 'develop']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Installing dependencies
        run: npm ci
      - name: Running linting and tests
        run: npm test
      - name: Building package
        run: npm run build

  package:
    name: package (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Installing dependencies
        run: npm ci
      - name: Testing packed package
        run: npm run test:package
