name: fastmail-integration-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastmail-integration-test
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Installing dependencies
        run: npm ci
      - name: Run Fastmail integration test
        env:
          JMAP_TOKEN: ${{ secrets.JMAP_TOKEN }}
          JMAP_HOSTNAME: ${{ secrets.JMAP_HOSTNAME }}
        run: npm run test:integration
